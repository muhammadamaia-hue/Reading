<p>جارٍ فتح أحدث نسخة من JoyRead…<br>

<script>
/* This page never changes, so the browser may cache it freely. Every visit it sends
   you on to joyread.html under an address the browser has never seen, which forces
   a fresh copy. Settings and the dictionary are stored per-site, not per-address,
   so nothing of yours is affected. */
var url = "joyread.html?v=" + Date.now();
document.getElementById("fb").href = url;
location.replace(url);
</script>
